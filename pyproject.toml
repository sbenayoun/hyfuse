[project]
name = "hyfuse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stephane Benayoun", email = "stephane.benayoun@curtin.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "nvcl-kit>=1.3.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pytsg>=1.0.0",
    "pyyaml>=6.0.3",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.65.0",
    "tenacity>=9.2.1",
]

[project.scripts]
hyfuse = "hyfuse:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
