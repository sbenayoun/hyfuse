# config/params.yaml — pre-registered parameters (T2.5).
#
# CRITICAL: success criteria and tolerances are frozen here BEFORE results
# are seen, and this file must be committed before the first results file.
# See PROJECT_BRIEF.md section 6 and AGENT_INSTRUCTIONS.md T2.5.

seed: 42

# --- Compositional features (T2.3) ---
# CLR (centered log-ratio) is applied PER VIEW separately; SWIR and TIR
# abundances are NEVER pooled into one composition.
# Zero handling: a zero mineral-group abundance means "not detectable in this
# view", NOT a trace amount. CLR needs strictly positive parts, so we use a
# multiplicative zero replacement: replace zeros with delta, renormalise the
# non-zero parts down to preserve the simplex. delta is recorded here and is
# ABLATABLE. (ASSUMPTION: delta small relative to smallest positive abundance.)
clr:
  zero_strategy: multiplicative_replacement
  delta: 1.0e-6
  # min_groups: a window needs >= this many non-zero groups to form a composition
  min_nonzero_groups: 1

# --- Depth compositing / joins (T2.1) ---
window_size_m: 5.0        # GSWA gold example uses 5 m averaged cut-offs
min_interval_m: 1.0       # minimum domain interval length (ruptures)

# --- Boundary agreement metric (T2.5) — PRE-REGISTERED, frozen before results ---
# Committed BEFORE any scoring/results file exists (verifiable via
# `git log -p config/params.yaml`). Do not change after seeing results without a
# written reason in the README.
depth_tolerance_m: 2.0    # a detected boundary matches a logged boundary if within this
boundary_metric: f1       # report precision, recall AND f1 within tolerance
boundary_scoring:
  match: boundary_within_tolerance   # score BOUNDARIES, not lithology-code equality
  tolerance_m: 2.0                    # same as depth_tolerance_m (kept explicit)
  permutation:
    n: 1000                           # random-boundary baseline draws
    strategy: same_count_per_hole     # random boundaries, same count as detected, per hole
  min_logged_intervals: 3             # holes with fewer logged intervals are reported but flagged
  # Logged boundaries come from wamex_dh_geology interval edges (FromDepth/ToDepth),
  # company-specific codes -> score interval BOUNDARIES, not code matches.

# --- Cross-validation (T2.5, T3.3) ---
cv:
  scheme: GroupKFold      # grouped by hole_id (leave-holes-out)
  n_splits: 5
  group_by: hole_id

# --- Bootstrap (uncertainty) ---
bootstrap:
  n_resamples: 1000
  unit: hole              # resample over holes, not windows

# --- Assay targets (T2.2); chosen from coverage audit, max 3 ---
# Chosen from shortlist coverage: Au_PPM is the ONLY element with broad hole
# coverage (2362 rows across all 15 holes). Cu/S/K2O/Ag exist in only 3 holes
# and As in 2 -> too few for leave-holes-out CV, so NOT used as targets.
# Honest single-target choice for a gold shortlist.
assay_targets: [Au_PPM]

# --- Assay hygiene (T2.2) — rules the ingestion MUST enforce ---
# R1 reviewer (F3) confirmed on real DASC data: below-detection values are
# encoded as NEGATIVES (49,541/236,719 Au_PPM rows < 0, down to -5000), and
# Au_PPM reaches 421300 (~42%) which is implausible. T2.2 must handle both.
assay_hygiene:
  below_detection: negative_is_censored   # treat x<0 as "< |x|"; impute |x|/2 (ASSUMPTION, ablate)
  flag_not_drop: true                      # flag implausible values, never silently drop
  plausibility_ppm:                        # per-element sanity ranges (flag outside)
    Au_PPM: [0, 100000]                    # 100000 ppm = 10%; above => flag unit/entry error
    As_PPM: [0, 100000]
  # VERIFY with a GSWA expert: exact below-detection convention + Au outlier reality.

# --- SWIR-active mineral set for planted-truth sim (T3.1) ---
# ASSUMPTION: first guess from a GSWA geologist's statement + Spectral
# Regions slide. SWIR sees hydroxyl-bearing minerals, carbonates, sulfates;
# NOT anhydrous silicates. Chlorite is in BOTH views. VERIFY against the
# GSWA SKOS vocabulary.
swir_active_minerals:
  - white_mica
  - chlorite        # also appears in TIR (bridge mineral)
  - kaolinite
  - carbonate
  - sulfate

# --- Success criterion (pre-registered, PROJECT_BRIEF.md section 6) ---
# Fusion beats the best single view on >=1 metric with a hole-level bootstrap
# interval excluding zero, and is not worse on the others.
success:
  must_beat: best_single_view
  min_metrics_improved: 1
  interval_excludes_zero: true
